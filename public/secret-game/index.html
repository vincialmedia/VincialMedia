/* ---------- api ---------- */
const PARAMS = {
  create: ["name"], peek: ["invite"], join: ["invite", "name"], state: ["token"],
  save: ["token", "answers"], custom: ["token", "custom"], delete: ["token"]
};
const MESSAGES = {
  400: "That didn't work. Check what you typed and try again.",
  401: "This game doesn't exist anymore.",
  404: "This invite link was already used or doesn't exist.",
  429: "No room for new games right now.",
  503: "The game's server can't be reached right now."
};
async function api(action, payload){
  const body = {};
  for (const k of PARAMS[action]) body["p_" + k] = (payload || {})[k];
  let r;
  try {
    r = await fetch(SB_URL + "/rest/v1/rpc/sg_" + action, {
      method: "POST",
      headers: { "apikey": SB_KEY, "Content-Type": "application/json" },
      body: JSON.stringify(body),
      cache: "no-store"
    });
  } catch(e){ const err = new Error("You seem to be offline."); err.status = 0; throw err; }
  let data = null;
  try { data = await r.json(); } catch(e){}
  if (!r.ok){
    const hint = data && data.hint, code = data && data.code;
    let status = r.status >= 500 ? 503 : r.status;
    if (hint === "gone" || code === "PT401") status = 401;
    else if (hint === "used" || code === "PT404") status = 404;
    else if (hint === "full" || code === "PT429") status = 429;
    else if (hint === "invalid" || code === "PT400") status = 400;
    const known = hint === "gone" || hint === "used" || hint === "full" || hint === "invalid";
    const err = new Error((known && data.message) || MESSAGES[status] || MESSAGES[503]);
    err.status = status;
    throw err;
  }
  return data;
}
function apply(st, keepAnswers){
  if (!st || !st.me) return;
  S.meName = String(st.me.name || "");
  S.hasPartner = !!st.partner;
  S.partnerName = st.partner ? String(st.partner.name || "") : "";
  S.partnerCount = st.partner ? Number(st.partner.count) || 0 : 0;
  S.invite = typeof st.invite === "string" ? st.invite : null;
  S.custom = cleanCustom(st.custom);
  S.matches = Array.isArray(st.matches) ? st.matches.filter(m => m && typeof m.k === "string" && (m.l === "y" || m.l === "m")) : [];
  if (!keepAnswers) S.answers = cleanAnswers(st.me.answers);
  loaded = true;
}
function handleError(e){
  if (e.status === 401){
    lsDel(LS_TOKEN);
    S.token = null; loaded = false;
    S.banner = e.message || "This game doesn't exist anymore.";
    go("start");
    return;
  }
  if (e.status === 503) setStatus("setup");
  else if (e.status === 0) setStatus("offline");
  else setStatus("unsaved");
}

function setAnswer(key, val){
  S.answers = Object.assign({}, S.answers, { [key]: val });
  dirty = true;
  scheduleSave(600);
}
function scheduleSave(ms){ clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, ms); }
async function saveNow(){
  if (!S.token || !dirty) return;
  if (inflight){ scheduleSave(400); return; }
  inflight = true; dirty = false;
  setStatus("saving");
  try {
    const st = await api("save", { token: S.token, answers: Object.assign({}, S.answers) });
    apply(st, true);
    setStatus(dirty ? "saving" : "synced");
    if (S.view !== "play") render();
  } catch(e){
    dirty = true;
    handleError(e);
    if (S.token) scheduleSave(6000);
  } finally { inflight = false; }
}
async function refresh(){
  if (!S.token || inflight) return;
  try {
    const st = await api("state", { token: S.token });
    apply(st, dirty || inflight);
    if (!dirty) setStatus("synced");
    if (S.view === "loading") S.view = "home";
    if (S.view !== "play") render();
  } catch(e){
    if (S.view === "loading" && e.status !== 401){ S.view = "home"; render(); }
    handleError(e);
  }
}
async function saveCustom(next){
  S.custom = next;
  render();

  const resolved = S.matches.map(m => ({ m, it: itemFor(m) })).filter(x => x.it);
  const both = resolved.filter(x => x.m.l === "y");
  const chat = resolved.filter(x => x.m.l === "m");
  const dirLine = ({ m, it }) => {
    if (m.k.endsWith(":give")) return `<span class="m-dir"><b>You → ${esc(pname())}</b> · ${esc(fill(it.give, pname()))}</span>`;
    if (m.k.endsWith(":get"))  return `<span class="m-dir"><b>${esc(Pname())} → you</b> · ${esc(fill(it.get, pname()))}</span>`;
    return `<span class="m-dir">Together</span>`;
  };
  const list = (arr, cls) => CATS.map(c => ({ c, xs: arr.filter(x => x.it.c === c.id) })).filter(g => g.xs.length).map(g => `
    <div class="group"><h3>${esc(g.c.name)}</h3><ul class="m-list">
      ${g.xs.map(x => `<li class="m-item ${cls}"><div class="m-top"><span class="m-name">${esc(x.it.n)}</span>${heat(x.it.h)}</div>${dirLine(x)}</li>`).join("")}
    </ul></div>`).join("");
  const partnerDone = Math.min(S.partnerCount, pm.total);
  return `${bar()}
  <div class="play-head"><button class="back" data-act="home">‹ Home</button></div>
  <div class="m-head"><span class="big">${both.length}</span><h1>double ${both.length === 1 ? "yes" : "yeses"}</h1></div>
  <p class="score-sub">${S.hasPartner
    ? `You've answered ${pm.done} of ${pm.total}, ${esc(S.partnerName)} ${partnerDone} of ${pm.total}. More can show up as you both keep going.`
    : `Your partner hasn't joined yet. Send the invite link from the home screen.`}</p>
  ${both.length ? list(both, "yes") : `<div class="empty">${S.hasPartner && S.partnerCount ? "No double yeses yet. Keep going." : "Nothing yet."}</div>`}
  ${chat.length ? `<h2 class="section-h">Worth talking about</h2><p class="score-sub">One of you said yes, the other said maybe.</p>${list(chat, "")}` : ""}
  <p class="legend">Arrows point from whoever does it to whoever gets it. The database compares your answers and only sends back matches, so neither of you can see the other's other answers.</p>`;
}

function keepForm(){
  const d = document.getElementById("add-details");
  const st = document.getElementById("settings-details");
  const t = document.getElementById("cq-text");
  const n = document.getElementById("name-in");
  return {
    open: d ? d.open : false, sopen: st ? st.open : false,
    text: t ? t.value : "", dir: !!(document.getElementById("cq-dir") || {}).checked,
    heat: (document.getElementById("cq-heat") || {}).value, name: n ? n.value : "",
    focus: document.activeElement && document.activeElement.id
  };
}
function restoreForm(k){
  const d = document.getElementById("add-details"); if (d) d.open = k.open;
  const st = document.getElementById("settings-details"); if (st) st.open = k.sopen;
  const t = document.getElementById("cq-text"); if (t) t.value = k.text;
  const n = document.getElementById("name-in"); if (n) n.value = k.name;
  if (k.dir && document.getElementById("cq-dir")) document.getElementById("cq-dir").checked = true;
  if (k.heat && document.getElementById("cq-heat")) document.getElementById("cq-heat").value = k.heat;
  if (k.focus){ const f = document.getElementById(k.focus); if (f) f.focus(); }
}
function render(){
  const kept = keepForm();
  let html;
  switch (S.view){
    case "start":   html = viewStart(); break;
    case "join":    html = viewJoin(); break;
    case "home":    html = viewHome(); break;
    case "play":    html = viewPlay(); break;
    case "matches": html = viewMatches(); break;
    default:        html = `<p class="loading">Loading…</p>`;
  }
  $view.innerHTML = html;
  restoreForm(kept);
}
function go(view){
  clearTimeout(advanceTimer);
  if (view !== "home"){ S.clearArmed = false; S.deleteArmed = false; }
  S.view = view;
  render();
  window.scrollTo(0, 0);
}

/* ---------- play flow ---------- */
function startSeq(cat){
  S.seqCat = cat;
  if (cat){
    S.seq = allItems().filter(it => it.c === cat).map(it => it.id);
    const first = S.seq.findIndex(id => !isDone(itemById(id)));
    S.idx = first < 0 ? 0 : first;
  } else {
    S.seq = allItems().filter(it => !isDone(it)).map(it => it.id);
    S.idx = 0;
  }
  lastCardKey = null;
  go("play");
}
function step(d){
  clearTimeout(advanceTimer);
  S.idx = Math.max(0, Math.min(S.seq.length, S.idx + d));
  render();
  window.scrollTo(0, 0);
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act !== "clear") S.clearArmed = false;
  if (act !== "delete") S.deleteArmed = false;
  switch (act){
    case "home": S.banner = ""; go(S.token ? "home" : "start"); break;
    case "continue": startSeq(null); break;
    case "cat": startSeq(b.dataset.c); break;
    case "matches": go("matches"); refresh(); break;
    case "prev": step(-1); break;
    case "next": step(1); break;
    case "ans": {
      const it = itemById(S.seq[S.idx]);
      const wasDone = it && isDone(it);
      setAnswer(b.dataset.key, b.dataset.val);
      render();
      if (it && !wasDone && isDone(it)){
        const at = S.idx;
        clearTimeout(advanceTimer);
        advanceTimer = setTimeout(() => { if (S.view === "play" && S.idx === at) step(1); }, 360);
      }
      break;
    }
    case "copy": {
      const input = document.getElementById(b.dataset.target);
      if (!input) break;
      const done = () => { b.textContent = "Copied"; setTimeout(() => { b.textContent = "Copy"; }, 1600); };
      const fallback = () => { input.focus(); input.select(); try { if (document.execCommand("copy")) done(); } catch(err){} };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(input.value).then(done, fallback);
      else fallback();
      break;
    }
    case "clear":
      if (S.clearArmed){ S.clearArmed = false; S.answers = {}; dirty = true; saveNow(); render(); }
      else { S.clearArmed = true; render(); }
      break;
    case "delete":
      if (!S.deleteArmed){ S.deleteArmed = true; render(); break; }
      S.deleteArmed = false;
      api("delete", { token: S.token }).then(() => {
        lsDel(LS_TOKEN); S.token = null; loaded = false; S.answers = {}; S.matches = []; S.meName = "";
        S.banner = "Your game is deleted.";
        go("start");
      }, handleError);
      break;
    case "rmq":
      saveCustom(S.custom.filter(c => c.id !== b.dataset.id));
      break;
  }
});

document.addEventListener("submit", async e => {
  const id = e.target.id;
  if (id !== "start-form" && id !== "join-form" && id !== "add-form") return;
  e.preventDefault();
  if (id === "add-form"){
    const t = document.getElementById("cq-text");
    const text = (t.value || "").trim().slice(0, 140);
    if (!text || S.custom.length >= 50) return;
    const dir = document.getElementById("cq-dir").checked;
    const h = parseInt(document.getElementById("cq-heat").value, 10) || 2;
    const cid = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    t.value = "";
    saveCustom(S.custom.concat([{ id: cid, n: text, t: dir ? "dir" : "both", h }]));
    return;
  }
  const name = (document.getElementById("name-in").value || "").trim();
  if (!name || S.busy) return;
  S.busy = true; S.formError = ""; render();
  try {
    const res = id === "start-form"
      ? await api("create", { name })
      : await api("join", { invite: S.joinInvite, name });
    S.token = res.token;
    lsSet(LS_TOKEN, res.token);
    apply(res, false);
    S.joinInvite = null; S.banner = "";
    setStatus("synced");
    S.busy = false;
    go("home");
  } catch(err){
    S.busy = false;
    S.formError = err.status === 503 ? "The game's server can't be reached right now. Try again in a minute."
      : err.status === 0 ? "You seem to be offline. Check your connection and try again."
      : err.message;
    render();
  }
});

/* ---------- live updates ---------- */
setInterval(() => {
  if (document.visibilityState === "visible" && S.token && S.view !== "play") refresh();
}, 8000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && S.token) refresh();
  if (document.visibilityState === "hidden" && dirty) saveNow();
});

/* ---------- boot ---------- */
(async function boot(){
  const params = new URLSearchParams(location.hash.slice(1));
  const join = params.get("join");
  const me = params.get("me");
  if (join || me) history.replaceState(null, "", location.pathname + location.search);
  const valid = t => typeof t === "string" && /^[A-Za-z0-9_-]{20,80}$/.test(t);
  if (valid(me)) lsSet(LS_TOKEN, me);
  S.token = valid(me) ? me : lsGet(LS_TOKEN);

  if (valid(join)){
    S.joinInvite = join;
    S.view = "join";
    render();
    try { const p = await api("peek", { invite: join }); S.inviterName = String(p.name || ""); render(); }
    catch(e){
      S.joinInvite = null;
      S.banner = e.status === 404 ? e.message : "The invite couldn't be checked right now. Try the link again in a moment.";
      go(S.token ? "home" : "start");
      if (S.token) refresh();
    }
    return;
  }
  if (S.token){ S.view = "loading"; render(); refresh(); }
  else go("start");
})();
})();
</script>
