<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>This page has moved</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #190c15; color: #f6e9f0; font: 17px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width: 22rem; padding: 2rem; text-align: center; }
  a { color: #ff5c93; }
  small { display: block; margin-top: 1rem; opacity: .7; }
</style>
</head>
<body>
<main>
  <p>This game has moved.</p>
  <p><a id="go" href="https://double-yes.app/">Continue at double-yes.app</a></p>
  <small id="note" hidden>Your game comes with you.</small>
</main>
<script>
// The game no longer lives on this site. This page only passes people on to
// its new address, together with a game saved in this browser or an old invite
// or personal link, so nobody loses their game. The key travels in the part of
// the address after "#", which browsers never send to a server.
(function () {
  var NEW = "https://double-yes.app/";
  function valid(t) { return typeof t === "string" && /^[A-Za-z0-9_-]{20,80}$/.test(t); }
  var params = new URLSearchParams(location.hash.slice(1));
  var me = params.get("me");
  var join = params.get("join");
  var saved = null;
  try { saved = localStorage.getItem("doubleyes.token"); } catch (e) {}
  var target = NEW;
  if (valid(join)) target = NEW + "#join=" + join;
  else if (valid(me)) target = NEW + "#me=" + me;
  else if (valid(saved)) target = NEW + "#me=" + saved;
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);
  document.getElementById("go").href = target;
  if (target !== NEW) document.getElementById("note").hidden = false;
  location.replace(target);
})();
</script>
</body>
</html>
