<style>
  :root{
    --ground:#14201c; --surface:#1c2b25; --surface-2:#24382f;
    --bronze:#c98f45; --bronze-hot:#e8b563; --patina:#74a98f;
    --text:#ece6d9; --muted:#8da096;
    --line:rgba(236,230,217,.10); --line-2:rgba(236,230,217,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--ground)}
  body{
    color:var(--text); font-family:'Barlow',system-ui,sans-serif; font-size:16px; line-height:1.45;
    padding:calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
            calc(44px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    max-width:640px; margin:0 auto; min-height:100vh;
  }
  h1,h2{margin:0}

  .masthead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
  .masthead h1{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:26px;letter-spacing:.06em;text-transform:uppercase}
  .masthead .sub{font-size:12px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
  .rotline{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:500;color:var(--patina);letter-spacing:.03em;margin:0 0 22px}

  .prompt{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
  .row{display:grid;gap:8px;margin-bottom:10px}
  .row.three{grid-template-columns:repeat(3,1fr)}
  .row.two{grid-template-columns:repeat(2,1fr)}

  .pick{
    appearance:none;border:1px solid var(--line-2);background:var(--surface);color:var(--text);
    border-radius:3px;padding:16px 8px 13px;cursor:pointer;font-family:inherit;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    transition:background .15s ease,border-color .15s ease,color .15s ease;
  }
  .pick .big{font-family:'Anton',Impact,sans-serif;font-size:30px;line-height:1;letter-spacing:.02em}
  .pick .small{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .pick:hover{background:var(--surface-2)}
  .pick:focus-visible{outline:2px solid var(--bronze-hot);outline-offset:2px}
  .pick[aria-pressed="true"]{background:var(--bronze);border-color:var(--bronze-hot);color:#17130b}
  .pick[aria-pressed="true"] .small{color:rgba(23,19,11,.72)}
  .pick[disabled]{opacity:.32;cursor:not-allowed}

  .session{margin-top:26px;display:none}
  .session.on{display:block}
  .sess-head{border-top:1px solid var(--line-2);padding-top:14px}
  .sess-head h2{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:21px;letter-spacing:.05em;text-transform:uppercase}
  .intent{color:var(--muted);font-size:14.5px;margin:5px 0 3px}
  .format{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:500;color:var(--patina);letter-spacing:.03em;margin:0 0 16px}

  .meter{height:3px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin-bottom:18px}
  .meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--bronze),var(--bronze-hot));transition:width .3s ease}

  /* ---------- big exercise cards ---------- */
  .ex{
    background:var(--surface);border:1px solid var(--line);border-left:2px solid var(--surface-2);
    border-radius:3px;margin-bottom:10px;overflow:hidden;
    transition:background .15s ease,border-color .15s ease;
  }
  .ex.done{background:linear-gradient(90deg,rgba(201,143,69,.14),rgba(201,143,69,.04));border-left-color:var(--bronze)}
  .exhead{display:flex;align-items:baseline;gap:9px;padding:11px 12px 0}
  .idx{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--muted)}
  .nm{font-size:16.5px;font-weight:600;min-width:0}
  .ex.done .nm{color:var(--bronze-hot)}
  .ex.done .nm::after{content:" ✓";font-size:13px}
  .rx{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--bronze-hot);white-space:nowrap;margin-left:auto}
  .ex.done .rx{opacity:.5}

  .exbody{display:flex;gap:12px;padding:9px 12px 2px}
  .demo{
    width:104px;height:104px;flex:0 0 auto;background:var(--ground);
    border:1px solid var(--line);border-radius:3px;overflow:hidden;
  }
  .demo svg{width:100%;height:100%;display:block}
  .ex.done .demo{opacity:.55}
  .exinfo{flex:1;min-width:0}
  .mus{display:flex;flex-wrap:wrap;gap:4px;margin:1px 0 7px}
  .mus span{
    font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:500;letter-spacing:.08em;
    text-transform:uppercase;color:var(--patina);border:1px solid rgba(116,169,143,.35);
    padding:2px 6px;border-radius:2px;white-space:nowrap;
  }
  .ex.done .mus span{opacity:.55}
  .nt{font-size:13px;color:var(--muted);margin:0;line-height:1.4}
  .ex.done .nt{opacity:.5}

  .wtwrap{display:flex;align-items:center;gap:5px;margin-top:8px}
  .wt{
    width:62px;background:var(--ground);border:1px solid var(--line-2);border-radius:2px;
    color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;
    padding:5px 6px;text-align:right;
  }
  .wt:focus{outline:none;border-color:var(--bronze)}
  .wt::placeholder{color:var(--muted);font-weight:500}
  .kg{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)}
  .hist{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);white-space:nowrap;letter-spacing:.01em}
  .hist .up{color:var(--patina);font-weight:600}
  .hist .down{color:var(--bronze);font-weight:600}

  .exfoot{display:flex;gap:8px;padding:10px 12px 12px;margin-top:8px;border-top:1px solid var(--line)}
  .donebtn{
    flex:1;appearance:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;
    letter-spacing:.05em;text-transform:uppercase;padding:9px 10px;border-radius:3px;
    border:1px solid var(--line-2);background:transparent;color:var(--text);
    transition:background .15s ease,color .15s ease,border-color .15s ease;
  }
  .donebtn:hover{border-color:var(--bronze)}
  .donebtn:focus-visible,.swapbtn:focus-visible{outline:2px solid var(--bronze-hot);outline-offset:2px}
  .ex.done .donebtn{background:var(--bronze);border-color:var(--bronze-hot);color:#17130b}
  .swapbtn{
    appearance:none;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;
    letter-spacing:.05em;text-transform:uppercase;padding:9px 12px;border-radius:3px;
    border:1px solid var(--line);background:transparent;color:var(--muted);
    transition:color .15s ease,border-color .15s ease;
  }
  .swapbtn:hover{color:var(--text);border-color:var(--line-2)}

  @media (max-width:430px){
    .demo{width:92px;height:92px}
    .exbody{gap:10px}
  }

  .rule{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);margin-top:14px;padding-top:12px;line-height:1.6}

  .finish{
    width:100%;appearance:none;cursor:pointer;margin-top:16px;font-family:'Anton',Impact,sans-serif;
    font-size:17px;letter-spacing:.09em;text-transform:uppercase;padding:15px;border-radius:3px;
    border:1px solid var(--bronze);background:transparent;color:var(--bronze-hot);
    transition:background .15s ease,color .15s ease;
  }
  .finish:hover{background:var(--bronze);color:#17130b}
  .finish:focus-visible{outline:2px solid var(--bronze-hot);outline-offset:2px}

  .ledger{margin-top:34px;border-top:1px solid var(--line-2);padding-top:16px}
  .ltop{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:11px}
  .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .cnt{font-family:'Anton',Impact,sans-serif;font-size:20px;letter-spacing:.04em}
  .cnt .of{color:var(--muted);font-size:14px}
  .strip{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .strip span{height:34px;border-radius:2px;background:var(--surface);border:1px solid var(--line)}
  .strip span.cast{background:linear-gradient(160deg,var(--bronze-hot),var(--bronze) 55%,#8a5f28);border-color:var(--bronze-hot)}
  .last{font-size:13px;color:var(--muted);margin-top:11px}
  .last b{color:var(--patina);font-weight:600}
  .undo{appearance:none;background:none;border:0;padding:0;margin-left:8px;color:var(--muted);font-family:inherit;font-size:12.5px;text-decoration:underline;cursor:pointer}
  .undo:hover{color:var(--text)}
  .note{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.5}
  .warn{color:var(--bronze);font-size:12.5px;margin-top:10px;display:none}
  .warn.on{display:block}

  .mood{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
  .lbl2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .moodbtns{display:flex;gap:6px}
  .mb{
    width:40px;height:40px;border-radius:3px;border:1px solid var(--line-2);background:var(--surface);
    color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;cursor:pointer;
  }
  .mb[aria-pressed="true"]{background:var(--patina);border-color:var(--patina);color:#0f1a16}
  .mb:focus-visible{outline:2px solid var(--bronze-hot);outline-offset:2px}

  .gap{margin-top:10px;font-size:13.5px;color:var(--muted)}
  .gap.amber{color:var(--bronze);font-weight:600}

  .backup{margin-top:20px;border-top:1px solid var(--line);padding-top:12px;display:flex;gap:18px}
  .lnk{appearance:none;background:none;border:0;padding:0;color:var(--muted);font-family:inherit;font-size:12.5px;text-decoration:underline;cursor:pointer}
  .lnk:hover{color:var(--text)}
  .box{display:none;margin-top:10px}
  .box.on{display:block}
  .box textarea{
    width:100%;height:110px;background:var(--surface);border:1px solid var(--line-2);border-radius:3px;
    color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:11px;padding:8px;resize:vertical;
  }
  .go{
    margin-top:8px;appearance:none;background:var(--surface-2);border:1px solid var(--line-2);color:var(--text);
    font-family:inherit;font-size:13px;padding:9px 14px;border-radius:3px;cursor:pointer;
  }
  .msg{font-size:12.5px;color:var(--patina);margin-top:8px;min-height:1.2em}

  /* pose debug grid (only via ?anims) */
  .dbggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
  .dbggrid figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:4px}
  .dbggrid figcaption{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);text-align:center;padding:3px}
  .dbggrid svg{width:100%;aspect-ratio:1;display:block;background:var(--ground)}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="masthead">
  <h1>Training Card</h1>
  <span class="sub">Vince</span>
</div>
<p class="rotline" id="rotline"></p>

<p class="prompt">How long have you got?</p>
<div class="row three" id="dur"></div>

<p class="prompt" style="margin-top:16px">Where?</p>
<div class="row two" id="place"></div>
<p class="note" id="placenote"></p>

<section class="session" id="session">
  <div class="sess-head">
    <h2 id="sname"></h2>
    <p class="intent" id="sintent"></p>
    <p class="format" id="sformat"></p>
  </div>
  <div class="meter"><i id="meter"></i></div>
  <div id="list"></div>
  <p class="rule" id="srule"></p>
  <div class="mood">
    <span class="lbl2">Mood after</span>
    <div class="moodbtns" id="mood"></div>
  </div>
  <button class="finish" id="finish">Log this session</button>
</section>

<section class="ledger">
  <div class="ltop">
    <span class="lbl">This week</span>
    <span class="cnt"><span id="cnt">0</span><span class="of"> / 3</span></span>
  </div>
  <div class="strip" id="strip"></div>
  <p class="last" id="last"></p>
  <p class="gap" id="gap"></p>
  <p class="note">Three a week. The only hard rule: never miss two scheduled days in a row.</p>
  <p class="warn" id="warn">Saving is off in this view, so weights and sessions won't carry over. Everything else works.</p>

  <div class="backup">
    <button class="lnk" id="doBackup">Back up</button>
    <button class="lnk" id="doRestore">Restore</button>
  </div>
  <div class="box" id="bbox">
    <textarea id="bta" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
    <button class="go" id="bgo"></button>
    <p class="msg" id="bmsg"></p>
  </div>
</section>

<script>
/* =====================================================================
   Movement pool.
   Each slot holds 3-4 variants. The default rotates with the weekly
   block (A/B/C); the swap button overrides it for the current week.
   n = name · t = form cue · m = muscles · a = animation key · load = log kg
===================================================================== */
const V = {
  warmg:[
    {n:'Warm-up · bike',t:'Easy spin, enough to break a light sweat.',m:['Warm-up'],a:'bike'},
    {n:'Warm-up · rower',t:'Easy pace, then ten bodyweight squats.',m:['Warm-up'],a:'rower'},
    {n:'Warm-up · incline walk',t:'Brisk, then arm circles and ten air squats.',m:['Warm-up'],a:'treadmill'}
  ],
  warmh:[
    {n:'Jacks + squats',t:'20 jumping jacks, 10 squats, 10 arm circles.',m:['Warm-up'],a:'jacks'},
    {n:'High knees + lunges',t:'30 sec high knees, 10 lunges, 10 shoulder rolls.',m:['Warm-up'],a:'run'},
    {n:'Jacks + hip bridges',t:'20 jumping jacks, 10 hip bridges, 10 arm circles.',m:['Warm-up'],a:'jacks'}
  ],
  legs:[
    {n:'Leg press',t:'Feet mid-platform, knees track over toes. Never lock out.',m:['Quads','Glutes'],a:'legpress',load:1},
    {n:'Goblet squat',t:'Dumbbell at the chest, elbows inside the knees, sit between the heels.',m:['Quads','Glutes','Core'],a:'gobletsquat',load:1},
    {n:'Bulgarian split squat',t:'Rear foot on the bench, torso tall, drop straight down.',m:['Quads','Glutes'],a:'splitsquat',load:1},
    {n:'Barbell back squat',t:'Brace, sit down between the heels, chest proud. Depth over weight.',m:['Quads','Glutes','Core'],a:'backsquat',load:1}
  ],
  hinge:[
    {n:'Romanian deadlift',t:'Push the hips back, bar glued to the legs, stop at mid-shin.',m:['Hamstrings','Glutes','Back'],a:'rdl',load:1},
    {n:'Barbell hip thrust',t:'Chin tucked, ribs down, squeeze hard for a second at the top.',m:['Glutes','Hamstrings'],a:'hipthrust',load:1},
    {n:'Dumbbell good morning',t:'Light. Hinge at the hips, back stays flat the whole way.',m:['Hamstrings','Lower back'],a:'goodmorning',load:1},
    {n:'Conventional deadlift',t:'Bar over mid-foot, chest up, push the floor away. Reset every rep.',m:['Glutes','Hamstrings','Back'],a:'deadlift',load:1}
  ],
  push:[
    {n:'Incline dumbbell press',t:'Bench at 30 degrees. Elbows 45 degrees, press up and slightly back.',m:['Upper chest','Front delts','Triceps'],a:'inclinepress',load:1},
    {n:'Overhead press',t:'Ribs down, glutes tight, press straight up past the face.',m:['Shoulders','Triceps','Core'],a:'ohp',load:1},
    {n:'Flat barbell bench',t:'Shoulder blades pinned back, elbows about 45 degrees, bar to mid-chest.',m:['Chest','Triceps','Front delts'],a:'benchpress',load:1},
    {n:'Machine chest press',t:'Seat so handles meet mid-chest. Squeeze, slow on the way back.',m:['Chest','Triceps'],a:'chestpress',load:1}
  ],
  pull:[
    {n:'Lat pulldown',t:'Wide grip, chest up. Pull with the elbows, not the hands.',m:['Lats','Biceps'],a:'pulldown',load:1},
    {n:'Seated cable row',t:'Chest up, pull to the belly button, shoulder blades together. No rocking.',m:['Mid-back','Lats','Biceps'],a:'cablerow',load:1},
    {n:'Chest-supported row',t:'Face down on the incline bench. Zero cheating possible.',m:['Mid-back','Rear delts'],a:'csrow',load:1},
    {n:'Pull-ups',t:'Full hang at the bottom, chest to the bar. Add weight when 8 get easy.',m:['Lats','Biceps','Core'],a:'pullup',load:1}
  ],

/* =====================================================================
   Demo animation engine.
   A 2D stick figure driven by joint angles (forward kinematics).
   Side rig: angles in degrees. torso 0 = upright. Limb angles 0 = straight
   down from their joint, positive = toward the front (+x, figure faces right).
   Front rig: arm/leg angles 0 = down, positive = out to the side.
   Every animation ping-pongs between pose A and pose B.
===================================================================== */
const RL = {T:16.5,UA:8.6,FA:8.6,TH:12.6,SH:11.8,FT:4.6,HEAD:4.0,NK:6.4};
const CFG = {fig:'#ece6d9',back:'rgba(236,230,217,.32)',eq:'#74a98f',eqline:'rgba(116,169,143,.45)',floor:'rgba(236,230,217,.18)'};
const RAD = Math.PI/180;
const dT = a => [Math.sin(a*RAD), -Math.cos(a*RAD)];   /* torso: 0 = up   */
const dL = a => [Math.sin(a*RAD),  Math.cos(a*RAD)];   /* limbs: 0 = down */

function fkSide(p){
  const hip=[p.px,p.py];
  const tv=dT(p.t);
  const sh=[hip[0]+RL.T*tv[0], hip[1]+RL.T*tv[1]];
  const hd=[sh[0]+RL.NK*tv[0], sh[1]+RL.NK*tv[1]];
  const seg=(o,a,len)=>{const d=dL(a);return [o[0]+len*d[0], o[1]+len*d[1]];};
  const elF=seg(sh,p.uaF,RL.UA), haF=seg(elF,p.faF,RL.FA);
  const elB=seg(sh,(p.uaB!==undefined?p.uaB:p.uaF),RL.UA), haB=seg(elB,(p.faB!==undefined?p.faB:p.faF),RL.FA);
  const knF=seg(hip,p.thF,RL.TH), anF=seg(knF,p.shF,RL.SH);
  const knB=seg(hip,(p.thB!==undefined?p.thB:p.thF),RL.TH), anB=seg(knB,(p.shB!==undefined?p.shB:p.shF),RL.SH);
  const foot=(an,a)=>{const r=(a||0)*RAD;return [an[0]+RL.FT*Math.cos(r), an[1]+RL.FT*Math.sin(r)];};
  return {hip,sh,hd,elF,haF,elB,haB,knF,anF,knB,anB,
          toF:foot(anF,p.ftF), toB:foot(anB,(p.ftB!==undefined?p.ftB:p.ftF))};
}
function fkFront(p){
  const hip=[p.px,p.py];
  const tv=dT(p.t||0);
  const sh=[hip[0]+RL.T*tv[0], hip[1]+RL.T*tv[1]];
  const hd=[sh[0]+RL.NK*tv[0], sh[1]+RL.NK*tv[1]];
  const sL=[sh[0]-3.6,sh[1]+1], sR=[sh[0]+3.6,sh[1]+1];
  const hL=[hip[0]-2.6,hip[1]], hR=[hip[0]+2.6,hip[1]];
  const seg=(o,a,len,dir)=>[o[0]+dir*len*Math.sin(a*RAD), o[1]+len*Math.cos(a*RAD)];
  const elL=seg(sL,p.aL,RL.UA,-1), haL=seg(elL,(p.fL!==undefined?p.fL:p.aL),RL.FA,-1);
  const elR=seg(sR,p.aR,RL.UA, 1), haR=seg(elR,(p.fR!==undefined?p.fR:p.aR),RL.FA, 1);
  const knL=seg(hL,p.lL,RL.TH,-1), anL=seg(knL,(p.sL2!==undefined?p.sL2:p.lL),RL.SH,-1);
  const knR=seg(hR,p.lR,RL.TH, 1), anR=seg(knR,(p.sR2!==undefined?p.sR2:p.lR),RL.SH, 1);
  return {hip,sh,hd,sL,sR,elL,haL,elR,haR,knL,anL,knR,anR};
}

/* small svg helpers for equipment */

const E = {
  line:(a,b,w,c)=>'<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" stroke="'+(c||CFG.eq)+'" stroke-width="'+(w||2)+'" stroke-linecap="round"/>',
  circ:(p,r,c,fill)=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+r+'" '+(fill?'fill="'+(c||CFG.eq)+'"':'fill="none" stroke="'+(c||CFG.eq)+'" stroke-width="2"')+'/>',
  rect:(x,y,w,h,c,rot)=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+(c||CFG.eqline)+'" rx="1"'+(rot?' transform="rotate('+rot+' '+(x+w/2)+' '+(y+h/2)+')"':'')+'/>',
  plate:p=>E.circ(p,4.6)+E.circ(p,1.4,CFG.eq,1),                    /* barbell seen end-on */
  db:p=>E.rect(p[0]-3,p[1]-1.4,6,2.8,CFG.eq),
  bench:(x,y,w)=>E.rect(x,y,w,3,CFG.eqline)+E.line([x+3,y+3],[x+3,y+9],2,CFG.eqline)+E.line([x+w-3,y+3],[x+w-3,y+9],2,CFG.eqline),
  /* pad running along the torso: sgn -1 = support behind the back, +1 = under the chest */
  padT:(J,p,sgn)=>{
    const tv=dT(p.t), n=[-tv[1]*4.4*sgn, tv[0]*4.4*sgn];
    const a=[J.hip[0]+n[0]-tv[0]*5, J.hip[1]+n[1]-tv[1]*5];
    const b=[J.sh[0]+n[0]+tv[0]*7, J.sh[1]+n[1]+tv[1]*7];
    return E.line(a,b,5,CFG.eqline);
  }
};

  run:{dur:800,gy:86,

    eq:()=>E.line([12,90],[88,78],3,CFG.eqline)+E.line([12,93],[88,81],1.6,CFG.eqline)}

/* renderer ---------------------------------------------------------- */
const easeIO = x => x<.5 ? 2*x*x : 1-Math.pow(-2*x+2,2)/2;
function lerpPose(A,B,k){
  const o={};
  for(const key in A) o[key]=A[key]+( (B[key]!==undefined?B[key]:A[key]) -A[key])*k;
  for(const key in B) if(o[key]===undefined) o[key]=B[key];
  return o;
}
function poly(pts,c,w){
  return '<polyline points="'+pts.map(pt).join(' ')+'" fill="none" stroke="'+c+'" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round"/>';
}
function drawFrame(def,phase){
  const p=lerpPose(def.A,def.B,easeIO(phase));
  let s='';
  if(def.gy && def.gy<99) s+=E.line([8,def.gy],[92,def.gy],1.6,CFG.floor);
  if(def.v==='front'){
    const J=fkFront(p);
    if(def.eq) s+=def.eq(J,p);
    s+=poly([J.hL||J.hip,J.hip],CFG.fig,4);
    s+=poly([J.knL&&J.hip?J.hip:J.hip],CFG.fig,0);
    s+=poly([[J.hip[0]-2.6,J.hip[1]],J.knL,J.anL],CFG.fig,3.4);
    s+=poly([[J.hip[0]+2.6,J.hip[1]],J.knR,J.anR],CFG.fig,3.4);
    s+=poly([J.hip,J.sh],CFG.fig,4.4);
    s+='<circle cx="'+J.hd[0].toFixed(1)+'" cy="'+J.hd[1].toFixed(1)+'" r="'+RL.HEAD+'" fill="'+CFG.fig+'"/>';
    s+=poly([J.sL,J.elL,J.haL],CFG.fig,3.4);
    s+=poly([J.sR,J.elR,J.haR],CFG.fig,3.4);
  }else{
    const J=fkSide(p);
    if(def.eq) s+=def.eq(J,p);
    s+=poly([J.hip,J.knB,J.anB,J.toB],CFG.back,3.4);
    s+=poly([J.sh,J.elB,J.haB],CFG.back,3.2);
    s+=poly([J.hip,J.sh],CFG.fig,4.4);
    s+='<circle cx="'+J.hd[0].toFixed(1)+'" cy="'+J.hd[1].toFixed(1)+'" r="'+RL.HEAD+'" fill="'+CFG.fig+'"/>';
    s+=poly([J.hip,J.knF,J.anF,J.toF],CFG.fig,3.6);
    s+=poly([J.sh,J.elF,J.haF],CFG.fig,3.4);
  }
  return s;
}

const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const demoReg = new Map();   /* svg element -> anim key */
let rafOn = false;
const visSet = new Set();
const io = ('IntersectionObserver' in window)
  ? new IntersectionObserver(es=>{
      es.forEach(e=>{ if(e.isIntersecting) visSet.add(e.target); else visSet.delete(e.target); });
    },{rootMargin:'60px'})
  : null;

function tick(now){
  demoReg.forEach((key,el)=>{
    if(io && !visSet.has(el)) return;
    const def=ANIMS[key]; if(!def) return;
    const t=(now/def.dur)%1;
    const phase=t<.5 ? t*2 : 2-t*2;
    el.innerHTML=drawFrame(def,phase);
  });
  if(rafOn) requestAnimationFrame(tick);
}
function mountDemos(root){
  demoReg.forEach((k,el)=>{ if(io) io.unobserve(el); });
  demoReg.clear(); visSet.clear();
  root.querySelectorAll('.demo svg[data-anim]').forEach(el=>{
    const key=el.dataset.anim;
    if(!ANIMS[key]) return;
    if(REDUCED){ el.innerHTML=drawFrame(ANIMS[key],0.5); return; }
    demoReg.set(el,key);
    el.innerHTML=drawFrame(ANIMS[key],0);
    if(io) io.observe(el);
  });
  if(!REDUCED && demoReg.size && !rafOn){ rafOn=true; requestAnimationFrame(tick); }
}

/* =====================================================================
   storage & app state (unchanged from v1, plus swaps)
===================================================================== */
const KEY = 'training-state';
const remote = (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function') ? window.storage : null;
const local = (function(){
  try{ const t='__probe'; window.localStorage.setItem(t,'1'); window.localStorage.removeItem(t); return window.localStorage; }
  catch(e){ return null; }
})();
let saveTimer = null;

let state = { log:[], active:null, weights:{}, swaps:null };
let dur = null, place = null;

const $ = id => document.getElementById(id);
const todayISO = () => new Date().toISOString().slice(0,10);

function mondayOf(d){
  const x = new Date(d);
  x.setHours(0,0,0,0);
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x;
}
function weekKey(d){ return mondayOf(d).toISOString().slice(0,10); }
function block(){ return Math.floor(mondayOf(new Date()).getTime() / 604800000) % 3; }
const BLOCK_NAME = ['A','B','C'];

function daysAgo(iso){
  const a = new Date(iso + 'T00:00:00').getTime();
  const b = new Date().setHours(0,0,0,0);
  const d = Math.round((b - a) / 86400000);
  return d <= 0 ? 'today' : d === 1 ? 'yesterday' : d + 'd ago';
}

/* which variant is showing for a slot: swap override, else weekly block */
function vIdx(slot){
  const arr = V[slot];
  if(state.swaps && state.swaps.wk === weekKey(new Date()) && state.swaps.m && state.swaps.m[slot] !== undefined){
    return state.swaps.m[slot] % arr.length;
  }
  return block() % arr.length;
}
function doSwap(slot){
  const wk = weekKey(new Date());
  if(!state.swaps || state.swaps.wk !== wk) state.swaps = { wk:wk, m:{} };
  state.swaps.m[slot] = (vIdx(slot) + 1) % V[slot].length;
  save(); paint();
}

async function load(){
  try{
    if(navigator.storage && navigator.storage.persist) await navigator.storage.persist();
  }catch(e){}

  let raw = null;
  if(remote){
    try{ const r = await remote.get(KEY, false); if(r && r.value) raw = r.value; }
    catch(e){ /* nothing saved yet — expected on first run */ }
  }
  if(raw === null && local){
    try{ raw = local.getItem(KEY); }catch(e){}
  }
  if(raw){ try{ state = JSON.parse(raw); }catch(e){} }
  if(!remote && !local) $('warn').classList.add('on');

  if(!Array.isArray(state.log)) state.log = [];
  if(!state.weights || typeof state.weights !== 'object') state.weights = {};
  if(state.swaps && state.swaps.wk !== weekKey(new Date())) state.swaps = null;

  /* weekly reset clears the tick marks only — weights are never touched */
  if(state.active && state.active.week !== weekKey(new Date())) state.active = null;

  if(state.active && typeof state.active.id === 'string'){
    const parts = state.active.id.split('-');
    place = parts[0]; dur = parts[1];
  }
  paint();
}

function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    const json = JSON.stringify(state);
    if(local){ try{ local.setItem(KEY, json); }catch(e){} }
    if(remote){ try{ Promise.resolve(remote.set(KEY, json, false)).catch(function(){}); }catch(e){} }
  }, 350);
}

function sid(){ return (dur && place) ? place + '-' + dur : null; }
function checks(){ return (state.active && Array.isArray(state.active.checks)) ? state.active.checks : []; }

/* most recent number carries forward; prev is the last different session */
function wInfo(name){
  const h = state.weights[name] || [];
  if(!h.length) return { value:'', prev:null };
  const last = h[h.length-1];
  const isToday = last.d === todayISO();
  return { value:last.w, prev: isToday ? (h.length > 1 ? h[h.length-2] : null) : last };
}

function putWeight(name, w){
  if(!name || !isFinite(w) || w <= 0) return;
  const day = todayISO();
  const h = state.weights[name] || (state.weights[name] = []);
  if(h.length && h[h.length-1].d === day) h[h.length-1].w = w;
  else h.push({ d:day, w:w });
  if(h.length > 40) h.splice(0, h.length - 40);
}

function buildPickers(){
  $('dur').innerHTML = ['15','30','60'].map(v =>
    '<button class="pick" data-dur="'+v+'" aria-pressed="false"><span class="big">'+v+'</span><span class="small">min</span></button>').join('');
  $('place').innerHTML = [['gym','Gym'],['home','Bodyweight']].map(p =>
    '<button class="pick" data-place="'+p[0]+'" aria-pressed="false"><span class="big" style="font-size:19px">'+p[1]+'</span></button>').join('');
}

function start(){
  const k = sid();
  if(k && (!state.active || state.active.id !== k)){
    state.active = { id:k, checks:[], week:weekKey(new Date()) };
    save();
  }
  paint();
}

function paint(){
  $('rotline').textContent = 'Block ' + BLOCK_NAME[block()] + ' · rotates Monday · swap any lift';

  document.querySelectorAll('[data-dur]').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.dur === dur)));
  document.querySelectorAll('[data-place]').forEach(b => {
    const lock = dur === '60' && b.dataset.place === 'home';
    b.disabled = lock;
    b.setAttribute('aria-pressed', String(!lock && b.dataset.place === place));
  });
  $('placenote').textContent = dur === '60'
    ? 'The hour is a gym session. At home, do 30 minutes twice instead.' : '';

  const k = sid(), s = k ? SESSIONS[k] : null;
  $('session').classList.toggle('on', !!s);

  if(s){
    const done = checks();
    $('sname').textContent = s.name;
    $('sintent').textContent = s.intent;
    $('sformat').textContent = s.format;
    $('srule').textContent = s.rule;

    $('list').innerHTML = s.items.map((row, i) => {
      const slot = row[0], arr = V[slot], idx = vIdx(slot), ex = arr[idx];
      const reps = row[1], on = done.indexOf(i) !== -1;
      let wcell = '';
      if(ex.load){
        const info = wInfo(ex.n);
        let hist = '';
        if(info.prev){
          const d = (info.value !== '' ? Number(info.value) : 0) - info.prev.w;
          const tag = d > 0 ? '<span class="up">+'+(Math.round(d*10)/10)+'</span>'
                    : d < 0 ? '<span class="down">'+(Math.round(d*10)/10)+'</span>' : '';
          hist = '<span class="hist">last '+info.prev.w+' · '+daysAgo(info.prev.d)+' '+tag+'</span>';
        }
        wcell =
          '<div class="wtwrap"><input class="wt" type="number" inputmode="decimal" step="0.5" min="0" '+
          'data-ex="'+ex.n.replace(/"/g,'&quot;')+'" placeholder="kg" value="'+info.value+'"><span class="kg">kg</span>'+
          (hist ? '&nbsp;'+hist : '')+'</div>';
      }
      const chips = (ex.m||[]).map(m=>'<span>'+m+'</span>').join('');
      return '<div class="ex'+(on?' done':'')+'">'+
        '<div class="exhead"><span class="idx">'+String(i+1).padStart(2,'0')+'</span>'+
          '<span class="nm">'+ex.n+'</span><span class="rx">'+reps+'</span></div>'+
        '<div class="exbody">'+
          '<div class="demo" aria-hidden="true"><svg viewBox="0 0 100 100" data-anim="'+ex.a+'"></svg></div>'+
          '<div class="exinfo">'+
            '<div class="mus">'+chips+'</div>'+
            '<p class="nt">'+ex.t+'</p>'+wcell+
          '</div>'+
        '</div>'+
        '<div class="exfoot">'+
          '<button class="donebtn" data-i="'+i+'">'+(on?'Done':'Mark done')+'</button>'+
          '<button class="swapbtn" data-slot="'+slot+'" aria-label="Swap exercise">⇄ swap · '+(idx+1)+'/'+arr.length+'</button>'+
        '</div>'+
      '</div>';
    }).join('');

    $('meter').style.width = Math.round(done.length / s.items.length * 100) + '%';
    mountDemos($('list'));
  }
  ledger();
}

/* pull whatever is sitting in the fields into today's history */
function commitFields(){
  document.querySelectorAll('#list .wt').forEach(f => putWeight(f.dataset.ex, parseFloat(f.value)));
}

$('list').addEventListener('click', e => {
  const sw = e.target.closest('.swapbtn');
  if(sw){ commitFields(); doSwap(sw.dataset.slot); return; }
  const b = e.target.closest('.donebtn');
  if(!b || !state.active) return;
  commitFields();
  const i = Number(b.dataset.i), c = state.active.checks, at = c.indexOf(i);
  if(at === -1) c.push(i); else c.splice(at,1);
  save(); paint();
});

$('list').addEventListener('change', e => {
  const f = e.target.closest('.wt');
  if(!f) return;
  putWeight(f.dataset.ex, parseFloat(f.value));
  save();
});

$('dur').addEventListener('click', e => {
  const b = e.target.closest('[data-dur]');
  if(!b) return;
  commitFields();
  dur = b.dataset.dur;
  if(dur === '60') place = 'gym';
  start();
});

$('place').addEventListener('click', e => {
  const b = e.target.closest('[data-place]');
  if(!b || b.disabled) return;
  commitFields();
  place = b.dataset.place;
  start();
});

let moodPick = null;
$('mood').innerHTML = [1,2,3,4,5].map(v =>
  '<button class="mb" data-m="'+v+'" aria-pressed="false" aria-label="Mood '+v+' of 5">'+v+'</button>').join('');
$('mood').addEventListener('click', e => {
  const b = e.target.closest('[data-m]');
  if(!b) return;
  const v = Number(b.dataset.m);
  moodPick = (moodPick === v) ? null : v;
  document.querySelectorAll('[data-m]').forEach(x =>
    x.setAttribute('aria-pressed', String(Number(x.dataset.m) === moodPick)));
});

$('finish').addEventListener('click', () => {
  const k = sid();
  if(!k) return;
  commitFields();
  const entry = { d:new Date().toISOString(), id:k };
  if(moodPick) entry.m = moodPick;
  state.log.push(entry);
  state.active = null; dur = null; place = null; moodPick = null;
  document.querySelectorAll('[data-m]').forEach(x => x.setAttribute('aria-pressed','false'));
  save(); paint();
  window.scrollTo({ top:document.body.scrollHeight, behavior:'smooth' });
});

/* ---------- backup / restore ---------- */
let boxMode = null;
function showBox(mode){
  boxMode = mode;
  $('bbox').classList.add('on');
  $('bmsg').textContent = '';
  if(mode === 'out'){
    $('bta').value = JSON.stringify(state);
    $('bgo').textContent = 'Copy to clipboard';
  }else{
    $('bta').value = '';
    $('bgo').textContent = 'Restore from the text above';
  }
}
$('doBackup').addEventListener('click', () => showBox('out'));
$('doRestore').addEventListener('click', () => showBox('in'));
$('bgo').addEventListener('click', async () => {
  if(boxMode === 'out'){
    try{
      await navigator.clipboard.writeText($('bta').value);
      $('bmsg').textContent = 'Copied. Paste it into Notes or mail it to yourself.';
    }catch(e){
      $('bta').select();
      $('bmsg').textContent = 'Select the text above and copy it manually.';
    }
    return;
  }
  try{
    const next = JSON.parse($('bta').value);
    if(!next || !Array.isArray(next.log)) throw new Error('bad shape');
    state = next;
    if(!state.weights || typeof state.weights !== 'object') state.weights = {};
    state.active = null; dur = null; place = null;
    save(); paint();
    $('bmsg').textContent = 'Restored. ' + state.log.length + ' sessions back.';
  }catch(e){
    $('bmsg').textContent = 'That does not look like a backup. Nothing was changed.';
  }
});

function ledger(){
  const wk = weekKey(new Date());
  const mine = state.log.filter(x => { try{ return weekKey(new Date(x.d)) === wk; }catch(e){ return false; } });
  const month = state.log.filter(x => {
    const d = new Date(x.d), n = new Date();
    return d.getMonth() === n.getMonth() && d.getFullYear() === n.getFullYear();
  });

  $('cnt').textContent = mine.length;
  $('strip').innerHTML = [0,1,2].map(i => '<span class="'+(i < mine.length ? 'cast' : '')+'"></span>').join('');

  if(!state.log.length){
    $('last').textContent = 'Nothing logged yet. The first block is the hardest one to cast.';
    $('gap').textContent = '';
    $('gap').className = 'gap';
    return;
  }
  const last = new Date(state.log[state.log.length-1].d);
  const d = Math.floor((new Date().setHours(0,0,0,0) - new Date(last).setHours(0,0,0,0)) / 86400000);
  const when = d <= 0 ? 'today' : d === 1 ? 'yesterday' : d + ' days ago';

  const rated = state.log.filter(x => x.m).slice(-6);
  const moodBit = rated.length >= 3
    ? ' · mood ' + (Math.round(rated.reduce((a,b) => a + b.m, 0) / rated.length * 10) / 10) + ' avg'
    : '';

  $('last').innerHTML = 'Last session <b>'+when+'</b> · '+month.length+' this month'+moodBit+
    '<button class="undo" id="undo">undo</button>';
  const u = $('undo');
  if(u) u.addEventListener('click', () => { state.log.pop(); save(); paint(); });

  const g = $('gap');
  if(d >= 4){
    g.className = 'gap amber';
    g.textContent = d + ' days since the last one. Do a 15 today — it breaks the drift, and that is all it has to do.';
  }else if(d >= 2){
    g.className = 'gap amber';
    g.textContent = d + ' days off. Next one is today, before it becomes two missed in a row.';
  }else{
    g.className = 'gap';
    g.textContent = '';
  }
}

/* ---------- pose debug grid: /workout?anims&ph=0.5 ---------- */
const qs = new URLSearchParams(location.search);
if(qs.has('anims')){
  const ph = qs.has('ph') ? Math.max(0,Math.min(1,parseFloat(qs.get('ph'))||0)) : null;
  document.body.innerHTML = '<div class="dbggrid">'+Object.keys(ANIMS).map(k =>
    '<figure><svg viewBox="0 0 100 100" data-anim="'+k+'"></svg><figcaption>'+k+'</figcaption></figure>').join('')+'</div>';
  document.querySelectorAll('[data-anim]').forEach(el=>{
    if(ph!==null){ el.innerHTML=drawFrame(ANIMS[el.dataset.anim],ph); }
    else { demoReg.set(el,el.dataset.anim); }
  });
  if(ph===null){ rafOn=true; requestAnimationFrame(tick); }
}else{
  buildPickers();
  load();
}
</script>
